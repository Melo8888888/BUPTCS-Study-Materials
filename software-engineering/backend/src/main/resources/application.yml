server:
  port: 8080

spring:
  application:
    name: ev-charge-backend
  datasource:
    url: jdbc:h2:file:./data/ev-charge;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

evcharge:
  clock:
    initial-date: 2026-05-12
  auth:
    secret: ${EVCHARGE_JWT_SECRET:please-change-to-32bytes-minimum-secret-for-hs256-now}
    ttlHours: 24
    enabled: ${EVCHARGE_AUTH_ENABLED:true}
  parking:
    ratePerMinute: 0.5
    gracePeriodMinutes: 5

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ev_charge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
